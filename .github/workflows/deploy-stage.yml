name: Deploy one stage

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true

permissions:
  contents: write
  id-token: write

# One queue per stage, so a prod deploy waiting for approval never holds up staging.
concurrency:
  group: pages-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stage == 'prod' && 'production' || 'staging' }}
      url: ${{ vars.WEB_URL || format('https://tanatornmokkhao.github.io/ff-poc-hub/{0}/', inputs.stage) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Pages branch
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref -q refs/heads/gh-pages; then git worktree add pages gh-pages
          else git worktree add --orphan -b gh-pages pages; fi

      # Two roles through GitHub OIDC, no AWS keys stored. The runtime role is what the server runs
      # as (its credentials go to the container); the deploy role, assumed last, is what this job
      # runs as. Both accept only a job in this stage's environment.
      - name: Credentials for the server (runtime role)
        id: runtime
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RUNTIME_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          output-credentials: true
      - name: Credentials for this job (deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      - run: bash scripts/deploy.sh "${{ inputs.stage }}" pages
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
          RUNTIME_ACCESS_KEY_ID: ${{ steps.runtime.outputs.aws-access-key-id }}
          RUNTIME_SECRET_ACCESS_KEY: ${{ steps.runtime.outputs.aws-secret-access-key }}
          RUNTIME_SESSION_TOKEN: ${{ steps.runtime.outputs.aws-session-token }}

      - name: Publish
        working-directory: pages
        run: |
          cat > index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>ff-poc</title>
          <h1>ff-poc environments</h1>
          <ul><li><a href="staging/">staging</a></li><li><a href="prod/">prod</a></li></ul>
          EOF
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed on Pages."; exit 0; }
          git commit -qm "deploy ${{ inputs.stage }} from ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push -q origin gh-pages && exit 0; git pull -q --rebase origin gh-pages; done
          exit 1

      - name: Summary
        run: |
          {
            echo "### ${{ inputs.stage }} deployed"
            echo '```yaml'; cat "${{ inputs.stage }}/versions.yaml"; echo '```'
            echo "Site: ${WEB_URL:-https://tanatornmokkhao.github.io/ff-poc-hub/${{ inputs.stage }}/}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          WEB_URL: ${{ vars.WEB_URL }}

      # Rewrites the "Running now" block of the README from both versions.yaml files on main. The
      # README is outside the Deploy paths, so this commit does not deploy anything.
      - name: Show what runs where in the README
        env:
          STAGE: ${{ inputs.stage }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf status && git fetch -q origin main && git worktree add -q -f --detach status origin/main
            cd status
            v() { sed -n "s/^$2:[[:space:]]*\([^[:space:]#]*\)[[:space:]]*#*[[:space:]]*\(.*\)/\1 \2/p" "$1/versions.yaml"; }
            cell() { set -- $(v "$1" "$2"); [ "${1:-none}" = none ] && echo "none" || echo "\`$1\`${2:+ ($2)}"; }
            when() { if [ "$1" = "$STAGE" ]; then echo "$(date -u '+%Y-%m-%d %H:%M UTC') ([run]($RUN_URL))"
              else grep -E "^\| $1 \|" README.md | awk -F'|' '{gsub(/^ +| +$/, "", $6); print $6}' | grep . || echo "-"; fi; }
            {
              echo "<!-- status:start -->"
              echo "| Stage | be | fe | mobile | Last deployed |"
              echo "| --- | --- | --- | --- | --- |"
              for s in staging prod; do
                m=$(set -- $(v "$s" mobile); echo "${1:-none}")
                echo "| $s | $(cell "$s" be) | $(cell "$s" fe) | \`$m\` | $(when "$s") |"
              done
              echo
              echo "_Written by the Deploy workflow after each deploy; mobile is what the stores or testers were last given._"
              echo "<!-- status:end -->"
            } > ../status-block.md
            awk -v f=../status-block.md '/<!-- status:start -->/ {while ((getline l < f) > 0) print l; skip=1; next} /<!-- status:end -->/ {skip=0; next} !skip {print}' README.md > README.new
            mv README.new README.md
            if git diff --quiet; then echo "README already current."; cd ..; break; fi
            git commit -qam "docs: README shows $STAGE deploy"
            if git push -q origin HEAD:main; then cd ..; break; fi
            cd ..; git worktree remove -f status; sleep 3
          done
