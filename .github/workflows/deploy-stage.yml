name: Deploy one stage

on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stage == 'prod' && 'production' || 'staging' }}
      url: https://tanatornmokkhao.github.io/ff-poc-hub/${{ inputs.stage }}/
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Pages branch
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show-ref -q refs/heads/gh-pages; then git worktree add pages gh-pages
          else git worktree add --orphan -b gh-pages pages; fi

      # Settings come from config/ in git; this environment holds only the role to assume in AWS.
      - run: bash scripts/deploy.sh "${{ inputs.stage }}" pages
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

      - name: Publish
        working-directory: pages
        run: |
          cat > index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>ff-poc</title>
          <h1>ff-poc environments</h1>
          <ul><li><a href="staging/">staging</a></li><li><a href="prod/">prod</a></li></ul>
          EOF
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed on Pages."; exit 0; }
          git commit -qm "deploy ${{ inputs.stage }} from ${GITHUB_SHA::7}"
          git push origin gh-pages

      - name: Summary
        run: |
          {
            echo "### ${{ inputs.stage }} deployed"
            echo '```yaml'; cat "${{ inputs.stage }}/versions.yaml"; echo '```'
            echo "Site: https://tanatornmokkhao.github.io/ff-poc-hub/${{ inputs.stage }}/"
          } >> "$GITHUB_STEP_SUMMARY"
