name: Terraform

# Pull requests: fmt and validate only, no AWS access.
# main: plan and apply infra/ as ff-poc-terraform through GitHub OIDC (no AWS keys stored),
# after an approval on the infra environment. infra/bootstrap/ is applied by hand, never here.
on:
  pull_request:
    paths: ['infra/**']
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: 1.10.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for d in infra infra/bootstrap; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done

  apply:
    needs: check
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tf.plan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false -no-color tf.plan
      - name: Outputs
        run: |
          { echo "### Outputs"; echo '```'; terraform output -no-color; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
