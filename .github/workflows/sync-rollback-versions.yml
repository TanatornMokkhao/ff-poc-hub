name: Sync rollback versions

# After a prod release succeeds, rewrites the version dropdown of Rollback production with every
# prod/vX.Y.Z tag, newest first. Editing a workflow file needs a token with Workflows: write.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-rollback-versions
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'prod/v')) }}
    runs-on: ubuntu-latest
    env:
      FILE: .github/workflows/rollback.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Rewrite the dropdown
        run: |
          set -euo pipefail
          VERSIONS=$(git tag --list 'prod/v*' | sed 's#^prod/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vr || true)
          LIST=$(mktemp)
          for v in $VERSIONS; do echo "          - '$v'"; done > "$LIST"
          awk -v list="$LIST" '
            /# rollback-versions:start/ { print; while ((getline line < list) > 0) print line; skip = 1; next }
            /# rollback-versions:end/   { skip = 0 }
            !skip { print }
          ' "$FILE" > "$FILE.new" && mv "$FILE.new" "$FILE"
          echo "Versions: ${VERSIONS:-none}" | tr '\n' ' '; echo
          sed -n '/rollback-versions:start/,/rollback-versions:end/p' "$FILE"

      - name: Commit
        run: |
          set -euo pipefail
          git diff --quiet && { echo "Dropdown already current."; exit 0; }
          git config user.name "ff-poc release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "ci: rollback dropdown lists $(git tag --list 'prod/v*' | wc -l) prod versions"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
