name: Deploy

# Every change to staging/ or prod/ on main deploys that environment.
# staging: deploys at once. prod: waits for an approval on the production environment.
on:
  push:
    branches: [main]
    paths: ['staging/**', 'prod/**', 'config/**', 'scripts/**']
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to redeploy
        type: choice
        options: [staging, prod]

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.c.outputs.staging }}
      prod: ${{ steps.c.outputs.prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: c
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "${{ inputs.stage }}=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"
          grep -qE '^(staging/|config/staging|scripts/)' <<< "$CHANGED" && echo "staging=true" >> "$GITHUB_OUTPUT" || true
          grep -qE '^(prod/|config/prod)' <<< "$CHANGED" && echo "prod=true" >> "$GITHUB_OUTPUT" || true

  staging:
    needs: changes
    if: ${{ needs.changes.outputs.staging == 'true' }}
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: staging

  prod:
    needs: changes
    if: ${{ needs.changes.outputs.prod == 'true' }}
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
